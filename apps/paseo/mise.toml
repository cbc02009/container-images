# Toolset for paseo sessions working on the home-ops repo. Everything
# installs from static release binaries, so no lockfile is required.

[settings]
system_installs_dir = "/opt/mise/installs"
system_shims_dir = "/opt/mise/shims"

[tools]
age = "1.3.2"
flux2 = "2.10.0"
gh = "2.104.0"
helm = "4.3.2"
helmfile = "1.8.4"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
"github:mitsuhiko/minijinja" = "3.1.0"
sops = "3.13.3"
talosctl = "1.14.5"
"github:postfinance/topf" = "v0.6.2"
yq = "4.54.3"
